name: CI

on:
  pull_request:
    branches:
      - main
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  # job 名保持 fast-check，与仓库 main 分支保护要求的状态检查对齐。
  fast-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Shell check
        run: |
          bash -n src/CloverSec-CTF-Build-Dockerizer/scripts/verify.sh
          shellcheck -S warning src/CloverSec-CTF-Build-Dockerizer/scripts/verify.sh

      # 确认这个目录能被 skills 工具识别为一个合法 Skill。
      - name: Skill discovery
        run: npx -y skills add . --list
