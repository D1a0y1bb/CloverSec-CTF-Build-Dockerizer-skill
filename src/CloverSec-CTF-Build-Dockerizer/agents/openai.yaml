interface:
  display_name: "CloverSec CTF Build Dockerizer"
  short_description: "把 CTF 想法或源码整理为干净、可验证的 Docker 题目目录"
  brand_color: "#2563EB"
  default_prompt: "使用 $cloversec-ctf-build-dockerizer 处理当前题目目录或参考源码。先读取运行事实，再按 ctfctl.py inspect → ctfctl.py scaffold --profile clean → ctfctl.py build → ctfctl.py verify → ctfctl.py package 生成干净的 src/Dockerfile/start.sh/challenge.yaml 目录；普通题目使用 direct-exec，不生成 changeflag.sh、FLAG_UPDATE.md 或根目录机器报告。只有输入明确属于旧 helper、Scenario、Bundle、RDG/SecOps 或 Linux-QEMU 时，才读取对应高级资料。"

policy:
  allow_implicit_invocation: true
