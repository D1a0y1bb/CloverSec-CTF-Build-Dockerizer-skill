interface:
  display_name: "CloverSec CTF Pack"
  short_description: "把 CTF 题目源码整理成能上平台的 Docker 目录并本地验证"
  default_prompt: "用 $cloversec-ctf-pack 把当前题目整理成平台能导入的 Docker 题目目录，并用 verify.sh 验证。"

# 提问是流程的第一个节点，不是"遇到困难时的备选动作"。
# 开工前就要用 request_user_input 问清：题目类型和名称、容器题还是附件题、
# 要不要附件和镜像 tar、要不要 RDG 的 check、材料够不够、有没有原始手册。
# 做的过程中遇到影响交付形状的选择、要改题目难度、或打算降级处理时，同样停下来问。
# 一次问完同类问题，每题给 2~4 个直白选项并标出推荐项，问完等回答再动手。
interaction:
  request_user_input: true
  ask_first: true
  guidance: "先把影响交付形状的选择问清楚再开工，不要一头扎进去做完再问。需要问的完整清单和几个必须追问的情形见 SKILL.md 的「第一步就是提问，不是动手」。材料里已经写着的不问。"
