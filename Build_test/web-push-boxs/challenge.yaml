challenge:
  name: pixel-push-rce
  stack: php
  base_image: docker.m.daocloud.io/library/php:7.4-cli
  workdir: /var/www/html
  app_src: src
  app_dst: /var/www/html
  expose_ports:
    - "5000"
  start:
    mode: cmd
    cmd: "php -S 0.0.0.0:5000 -t /var/www/html"
  platform:
    entrypoint: "/start.sh"
    require_bash: true
  flag:
    path: "/flag"
    permission: "444"
