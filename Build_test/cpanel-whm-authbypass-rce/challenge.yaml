challenge:
  name: vul-2026050011
  stack: python
  profile: jeopardy
  base_image: python:3.11-slim
  workdir: /opt/whm
  app_src: .
  app_dst: /opt/whm
  expose_ports:
    - "2087"
  start:
    mode: cmd
    cmd: "python3 /opt/whm/whm_mock.py"
  platform:
    entrypoint: "/start.sh"
    require_bash: true
    allow_loopback_bind: false
  flag:
    path: "/flag"
    permission: "444"
  healthcheck:
    enabled: true
    cmd: "bash -lc 'echo > /dev/tcp/127.0.0.1/2087'"
    interval: "30s"
    timeout: "5s"
    retries: 3
    start_period: "10s"
